[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kora"
version = "0.1.0"
description = "KORA - Knowledge Optimization, Recovery & Assurance: proof-carrying storage reduction for recordings and documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pymupdf>=1.24",
  "python-pptx>=0.6.23",
  "pillow>=10",
  "numpy>=1.26",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "extract-msg>=0.48",
  # fallback speech recogniser; no Linux ARM wheels (Docker on Apple silicon uses Whisper only)
  "pocketsphinx>=5.0,<5.1; platform_system != 'Linux' or platform_machine == 'x86_64'",  # 5.0.x ships wheels
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
whisper = ["sherpa-onnx>=1.10"]
faster-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "pikepdf>=8"]

[project.scripts]
kora = "kora.cli:main"

[tool.setuptools.packages.find]
include = ["kora*"]

[tool.setuptools.package-data]
kora = ["policies/*.json", "ui/*", "ui/vendor/swagger/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
